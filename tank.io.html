<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>tank.io</title>
<style>
:root{--ov:rgba(8,16,30,.5);--ink:#f1f6ff;--hot:#ff4fa3;--zap:#39e0ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--ov:rgba(8,16,30,.55)}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#12202e;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
canvas#c{display:block;width:100%;height:100%;cursor:crosshair}
button,select,input{font-family:inherit}
button{cursor:pointer;color:#fff;border:0}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--zap);outline-offset:3px}
.ov{position:fixed;inset:0;display:none;place-items:center;background:var(--ov);text-align:center;padding:16px;overflow:auto}
.card{background:rgba(14,26,44,.88);border:2px solid rgba(57,224,238,.4);border-radius:22px;padding:24px;width:min(460px,100%);box-shadow:0 0 50px rgba(57,224,238,.2);display:grid;gap:14px}
h1,h2{margin:0}
.logo{font:900 clamp(3.4rem,13vw,6.5rem)/1 'Arial Black',Impact,sans-serif;letter-spacing:-.02em;background:linear-gradient(90deg,#5dff7a,#39e0ee,#ff4fa3,#ffd23f,#5dff7a);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.45));animation:hue 6s linear infinite,wob 2.6s ease-in-out infinite}
@keyframes hue{to{background-position:300% 0}}
@keyframes wob{50%{transform:rotate(-2deg) scale(1.04)}}
.inp{width:100%;background:rgba(40,160,150,.55);color:#fff;border:2px solid rgba(255,255,255,.35);border-radius:14px;padding:13px 16px;font:700 1.15rem 'Segoe UI',sans-serif;text-align:center}
.inp::placeholder{color:rgba(255,255,255,.65)}
.shake{animation:shk .4s;border-color:var(--hot)!important}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pill{display:flex;align-items:center;justify-content:space-between;gap:10px;width:min(340px,90vw);margin:0 auto;border-radius:44px;padding:8px 24px;font:900 1.6rem 'Arial Black',Impact,sans-serif;background:linear-gradient(#35d4ff,#1e8bd8);border:3px solid #0c4f8a;text-shadow:0 2px 0 rgba(0,0,0,.4);box-shadow:0 5px 0 #0a3a66;transition:transform .15s}
.pill.p2{background:linear-gradient(#b27cff,#6a3fd1);border-color:#3b2380;box-shadow:0 5px 0 #2a1860;font-size:1.2rem}
.pill:hover{transform:scale(1.05)}.pill:active{transform:translateY(4px);box-shadow:0 1px 0 #0a3a66}
.pill canvas{width:56px;height:56px}
.btn{background:var(--hot);border-radius:12px;padding:13px 28px;font:800 1.1rem 'Segoe UI',sans-serif;margin:0 auto}
.btn.g{background:rgba(255,255,255,.16)}
.corner{position:absolute;display:grid;justify-items:center;gap:4px;background:none;font-weight:800;font-size:.85rem;text-shadow:0 1px 3px #000}
.corner .ic{font-size:2.2rem;line-height:1;width:58px;height:58px;display:grid;place-items:center;border-radius:50%;background:rgba(120,70,220,.85);border:3px solid rgba(255,255,255,.5)}
.corner canvas{width:72px;height:72px}
#cTR{top:calc(12px + env(safe-area-inset-top,0px));right:14px;display:flex;gap:14px}
#cBL{left:14px;bottom:14px}#cBR{right:14px;bottom:14px}
#cBR input{width:90px}
#hint{position:absolute;bottom:14px;left:0;right:0;font-size:.8rem;opacity:.8;padding:0 130px;text-shadow:0 1px 3px #000}
#sk{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-height:54vh;overflow-y:auto;padding:6px;border-radius:12px;background:rgba(0,0,0,.25)}
#sk button{background:rgba(255,255,255,.08);border:2px solid transparent;border-radius:10px;padding:2px;transition:transform .15s}
#sk button:hover{transform:scale(1.15) rotate(-4deg)}
#sk button.sel{border-color:var(--zap);background:rgba(57,224,238,.2)}
#sk canvas{width:100%;height:auto;display:block}
#skn{font-weight:800;color:var(--zap);margin:0}
#setb{display:grid;gap:12px;text-align:left}
#setb label{display:grid;gap:5px;font-weight:700}
select{background:#16324f;color:var(--ink);border:1px solid #3a6c9a;border-radius:8px;padding:10px 12px;font:inherit}
input[type=range]{width:100%;accent-color:#39e0ee}
#hud{position:fixed;left:14px;top:calc(14px + env(safe-area-inset-top,0px));right:14px;display:none;pointer-events:none;font-weight:700;text-shadow:0 1px 3px #000;gap:6px}
#hud>div:first-child{display:grid;gap:6px}
.bar{width:220px;height:16px;border-radius:8px;background:rgba(0,0,0,.45);overflow:hidden}
#hp{height:100%;width:100%;background:#4be37a;transition:width .1s}
#gear{position:fixed;right:14px;top:calc(14px + env(safe-area-inset-top,0px));width:48px;height:48px;border-radius:50%;background:rgba(120,70,220,.85);border:3px solid rgba(255,255,255,.5);font-size:1.5rem;pointer-events:auto;display:none;z-index:3}
#touch{display:none}
.js{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom,0px));width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);touch-action:none;z-index:2}
.js i{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:rgba(255,255,255,.45)}
#jl{left:26px}#jr{right:26px}
#bb{position:fixed;right:40px;bottom:calc(190px + env(safe-area-inset-bottom,0px));width:68px;height:68px;border-radius:50%;background:rgba(176,124,66,.85);border:3px solid #fff;font-size:1.8rem;z-index:2}
#pop{animation:pop 1s cubic-bezier(.2,1.6,.4,1) both;font:900 clamp(2.4rem,9vw,4rem) 'Arial Black',sans-serif}
@keyframes pop{from{transform:scale(.2) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@media (max-width:560px){#sk{grid-template-columns:repeat(5,1fr)}#hint{display:none}}
@media (prefers-reduced-motion:reduce){.logo,#pop,.shake{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div><div id="al"></div><div class="bar"><div id="hp"></div></div><div id="wd"></div><div id="st"></div></div></div>
<button id="gear" aria-label="Settings">⚙</button>
<div id="touch"><div class="js" id="jl"><i></i></div><div class="js" id="jr"><i></i></div><button id="bb" aria-label="Wall">🧱</button></div>

<div class="ov" id="intro" style="display:grid"><div class="card">
<h1 class="logo">tank.io</h1>
<input class="inp" id="nick0" maxlength="14" autocomplete="off" spellcheck="false">
<button class="btn" id="done" data-i="done"></button>
</div></div>

<div class="ov" id="menu"><div style="display:grid;gap:16px;justify-items:center;width:100%">
<h1 class="logo">tank.io</h1>
<button class="inp" id="nickb" style="max-width:340px"></button>
<button class="pill" id="play"><canvas class="pv" width="72" height="72"></canvas><span data-i="play"></span><canvas class="pv" width="72" height="72"></canvas></button>
<button class="pill p2" id="train"><span data-i="train"></span></button>
</div>
<div id="cTR"><button class="corner" id="mfs"><span class="ic">⛶</span><span data-i="fsb"></span></button><button class="corner" id="mset"><span class="ic">⚙</span><span data-i="setB"></span></button></div>
<button class="corner" id="cBL"><canvas class="pv" id="pvm" width="72" height="72"></canvas><span data-i="skinsB"></span></button>
<div class="corner" id="cBR"><button class="corner" id="vb"><span class="ic" id="vi">🔊</span></button><input type="range" id="vm" min="0" max="100" aria-label="Volume"><span data-i="volB"></span></div>
<div id="hint" data-i="hint"></div>
</div>

<div class="ov" id="skins"><div class="card" style="width:min(640px,100%)">
<h2 data-i="skT"></h2><div id="sk"></div><p id="skn"></p><button class="btn" id="skb" data-i="back"></button>
</div></div>

<div class="ov" id="set" style="z-index:5"><div class="card">
<h2 data-i="setT"></h2><div id="setb"></div>
<button class="btn" id="sres" data-i="resume"></button><button class="btn g" id="smenu" data-i="tomenu"></button><button class="btn" id="sback" data-i="back"></button>
</div></div>

<div class="ov" id="end"><div class="card">
<h1 id="pop"></h1><p id="etx"></p>
<button class="btn" id="again" data-i="again"></button><button class="btn g" id="m2" data-i="tomenu"></button>
</div></div>

<script>
const $=id=>document.getElementById(id),rnd=(a,b)=>a+Math.random()*(b-a);
const L={
 uk:{done:'Готово',nickph:'Введіть нікнейм…',play:'Грати',train:'Тренування',skinsB:'Змінити скін',setB:'Налаштування',volB:'Гучність',fsb:'На весь екран',skT:'Скіни (64)',setT:'⚙️ Налаштування',
  lang:'Мова',gfx:'Графіка',low:'Низька',med:'Середня',high:'Висока',ctl:'Керування',auto:'Авто',pc:'Комп’ютер',ph:'Телефон',bots:'Кількість ботів',vol:'Гучність',
  back:'Назад',resume:'Продовжити',tomenu:'До меню',alive:'Живих',wood:'Дерево',storm:'Ви у шторму! Біжіть до зони',win:'Перемога!',winT:'Ви залишилися останнім на арені.',
  lose:'Вас вибили',loseT:s=>'Ви протрималися '+s+' с. Спробуйте ще раз.',again:'Грати знову',hint:'ПК: WASD — рух · миша — приціл і вогонь · E/Пробіл — стіна · Esc — налаштування'},
 en:{done:'Done',nickph:'Enter nickname…',play:'Play',train:'Training',skinsB:'Change skin',setB:'Settings',volB:'Volume',fsb:'Fullscreen',skT:'Skins (64)',setT:'⚙️ Settings',
  lang:'Language',gfx:'Graphics',low:'Low',med:'Medium',high:'High',ctl:'Controls',auto:'Auto',pc:'Computer',ph:'Phone',bots:'Number of bots',vol:'Volume',
  back:'Back',resume:'Resume',tomenu:'Main menu',alive:'Alive',wood:'Wood',storm:'You are in the storm! Run to the zone',win:'Victory!',winT:'You are the last one standing.',
  lose:'You were eliminated',loseT:s=>'You lasted '+s+' s. Try again.',again:'Play again',hint:'PC: WASD move · mouse aim & fire · E/Space wall · Esc settings'}
};
const SHN=[['Коло','Circle'],['Квадрат','Square'],['Шестикутник','Hexagon'],['Трикутник','Triangle'],['Ромб','Diamond'],['Восьмикутник','Octagon'],['Зірка','Star'],['П’ятикутник','Pentagon']];
const BRN=[['Одинарна','Single'],['Подвійна','Twin'],['Віяло','Fan'],['Гаубиця','Howitzer'],['Снайпер','Sniper'],['Розтруб','Flare'],['Зсув','Offset'],['Дуплет','Duo']];
const SK=Array.from({length:64},(_,i)=>({d:[i%8,i>>3,(i*137.5)%360,(i*5+(i>>3))%4],n:[SHN[i%8][0]+' · '+BRN[i>>3][0],SHN[i%8][1]+' · '+BRN[i>>3][1]]}));
const BN=['Zorro','Blaze','Nova','Pixel','Turbo','Ghost','Viper','Comet','Rocket','Shadow','Frost','Tiger','Echo','Mango','Storm','Ninja','Bolt','Panda'];
let S={lang:'uk',gfx:1,skin:0,nick:'',ctl:'auto',bots:11,vol:.6,mute:false};
try{Object.assign(S,JSON.parse(localStorage.getItem('tio')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('tio',JSON.stringify(S))}catch(e){}},T=k=>L[S.lang][k];

/* audio */
let AC=null;
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,ty,v,sl){if(!AC||S.mute||S.vol<=0||v<=0)return;const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(sl,n+d);g.gain.setValueAtTime(v*S.vol,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d)}
const SFX={shoot:v=>tone(420,.12,'square',.14*v,90),hit:v=>tone(150,.16,'sawtooth',.25*v,50),pick:()=>{tone(660,.1,'triangle',.3);setTimeout(()=>tone(990,.12,'triangle',.3),70)},
 build:()=>tone(220,.14,'square',.22,120),click:()=>tone(520,.06,'triangle',.22),
 win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.3,'triangle',.35),i*140)),lose:()=>[392,330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,.3,'sawtooth',.25),i*180))};
addEventListener('pointerdown',au);

/* tank drawing */
const SH=[null,[4,19,.785],[6,16,0],[3,18,0],[4,19,0],[8,16,.39],null,[5,17,0]];
function pth(g,s){g.beginPath();
  if(s===0)g.arc(0,0,15,0,7);
  else if(s===6){for(let i=0;i<10;i++){const a=i*Math.PI/5,q=i%2?10:19;g.lineTo(Math.cos(a)*q,Math.sin(a)*q)}g.closePath()}
  else{const[n,r,o]=SH[s];for(let i=0;i<n;i++){const a=o+i*6.2832/n;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath()}}
function drawTank(g,x,y,ang,sk,out){
  const[sh,br,h,dc]=sk.d,col='hsl('+h+' 72% 52%)',dk='hsl('+h+' 60% 26%)';
  g.save();g.translate(x,y);g.rotate(ang);
  g.fillStyle='#4a4f5e';g.strokeStyle='#14161d';g.lineWidth=1.5;
  const Bx=(a,b,w,k)=>{g.fillRect(a,b,w,k);g.strokeRect(a,b,w,k)};
  if(br===0)Bx(6,-3,22,6);
  else if(br===1){Bx(6,-8,22,5);Bx(6,3,22,5)}
  else if(br===2){Bx(6,-3,24,6);g.save();g.rotate(.45);Bx(6,-2.5,18,5);g.rotate(-.9);Bx(6,-2.5,18,5);g.restore()}
  else if(br===3)Bx(4,-7,16,14);
  else if(br===4)Bx(6,-2,34,4);
  else if(br===5){g.beginPath();g.moveTo(6,-3);g.lineTo(26,-9);g.lineTo(26,9);g.lineTo(6,3);g.closePath();g.fill();g.stroke()}
  else if(br===6){Bx(6,-10,24,5);Bx(6,4,12,6)}
  else{Bx(6,-3,30,6);Bx(6,-9,12,4);Bx(6,5,12,4)}
  g.fillStyle=col;pth(g,sh);g.fill();
  const gr=g.createRadialGradient(-5,-5,2,0,0,20);gr.addColorStop(0,'rgba(255,255,255,.55)');gr.addColorStop(.5,'rgba(255,255,255,0)');gr.addColorStop(1,'rgba(0,0,0,.4)');
  g.fillStyle=gr;pth(g,sh);g.fill();g.strokeStyle=out;g.lineWidth=2.5;pth(g,sh);g.stroke();
  g.fillStyle='rgba(255,255,255,.7)';
  if(dc===1){g.fillRect(-7,-8,3,16);g.fillRect(2,-8,3,16)}
  if(dc===2){g.beginPath();g.arc(-8,0,2.5,0,7);g.arc(-3,-6,2.5,0,7);g.arc(-3,6,2.5,0,7);g.fill()}
  if(dc===3){g.strokeStyle=dk;g.lineWidth=3;g.beginPath();g.arc(0,0,10,0,7);g.stroke()}
  g.fillStyle=dk;g.beginPath();g.arc(0,0,6.5,0,7);g.fill();g.fillStyle='rgba(255,255,255,.5)';g.beginPath();g.arc(-1,-1,2.8,0,7);g.fill();
  g.restore();
}
function prev(c,sk){const g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);drawTank(g,30,38,-.35,sk,'#111')}

/* ui */
const C=$('c'),X=C.getContext('2d');let W,H,Q=1;
function rs(){W=innerWidth;H=innerHeight;Q=[.6,1,Math.min(devicePixelRatio||1,2)][S.gfx];C.width=W*Q;C.height=H*Q}addEventListener('resize',rs);
const show=(id,on)=>$(id).style.display=on?'grid':'none',touchOn=()=>S.ctl==='touch'||(S.ctl==='auto'&&matchMedia('(pointer:coarse)').matches);
function fs(){const d=document,e=d.documentElement;if(d.fullscreenElement)d.exitFullscreen();else if(e.requestFullscreen)e.requestFullscreen().catch(()=>{})}
function ui(){
  document.documentElement.lang=S.lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T(e.dataset.i));
  $('nick0').placeholder=T('nickph');if(!$('nick0').value&&S.nick)$('nick0').value=S.nick;$('nickb').textContent='👤 '+(S.nick||'—')+' ✎';
  $('setb').innerHTML=`<label>${T('lang')}<select id="sl"><option value="uk">Українська</option><option value="en">English</option></select></label>
  <label>${T('gfx')}<select id="sg"><option value="0">${T('low')}</option><option value="1">${T('med')}</option><option value="2">${T('high')}</option></select></label>
  <label>${T('ctl')}<select id="sc"><option value="auto">${T('auto')}</option><option value="pc">${T('pc')}</option><option value="touch">${T('ph')}</option></select></label>
  <label>${T('bots')}: <b id="bn">${S.bots}</b><input type="range" id="sbt" min="1" max="100" value="${S.bots}"></label>
  <label>${T('vol')}<input type="range" id="sv" min="0" max="100" value="${Math.round(S.vol*100)}"></label>
  <button class="btn g" id="sfs">${T('fsb')}</button>`;
  $('sl').value=S.lang;$('sg').value=S.gfx;$('sc').value=S.ctl;
  $('sl').onchange=e=>{S.lang=e.target.value;save();ui()};
  $('sg').onchange=e=>{S.gfx=+e.target.value;save();rs()};
  $('sc').onchange=e=>{S.ctl=e.target.value;save();setS(state)};
  $('sbt').oninput=e=>{S.bots=+e.target.value;$('bn').textContent=S.bots};$('sbt').onchange=save;
  $('sv').oninput=e=>{S.vol=e.target.value/100;S.mute=false;$('vm').value=e.target.value;vi()};$('sv').onchange=()=>{save();SFX.click()};
  $('sfs').onclick=fs;$('vm').value=Math.round(S.vol*100);vi();
  const li=S.lang==='uk'?0:1,sk=$('sk'),sc=sk.scrollTop;sk.innerHTML='';
  SK.forEach((s,i)=>{const b=document.createElement('button'),c=document.createElement('canvas');c.width=72;c.height=72;prev(c,s);b.append(c);b.title=s.n[li];b.setAttribute('aria-label',s.n[li]);b.className=i===S.skin?'sel':'';
    b.onclick=()=>{S.skin=i;save();if(P&&DEMO())P.sk=SK[i];ui()};sk.append(b)});
  sk.scrollTop=sc;$('skn').textContent=SK[S.skin].n[li];
  document.querySelectorAll('.pv').forEach(c=>prev(c,SK[S.skin]));
  if(P&&state==='play')$('al').textContent=T('alive')+': '+A.filter(a=>a.hp>0).length;
}
const vi=()=>{$('vi').textContent=S.mute||S.vol<=0?'🔇':'🔊'};

/* game state */
let M=2400,R0=1920,SP=20,A=[],P=null,B=[],Wl=[],trees=[],pk=[],conf=[],t=0,winT=0,cx=1200,cy=1200,R=1920,state='intro',keys={},mouse={x:0,y:0,d:false},last=0,camx=0,camy=0,pend=false,foc=null,lastN=11;
const DEMO=()=>state==='intro'||state==='menu'||state==='skins';
function setS(s){state=s;$('touch').style.display=(s==='play'&&touchOn())?'block':'none'}
function mk(i){return{i,x:rnd(200,M-200),y:rnd(200,M-200),hp:100,wood:i?rnd(0,20):30,cd:0,a:0,tx:0,ty:0,tt:0,bc:0,sd:Math.random()<.5?1:-1,sk:i?SK[Math.floor(Math.random()*64)]:SK[S.skin],nm:i?BN[i%BN.length]+(i>=BN.length?i:''):(S.nick||'Player')}}
function world(n){
  M=Math.round(Math.max(2400,2400*Math.sqrt((n+1)/12)));R0=Math.round(M*.8);SP=R0/95;
  A=[];for(let i=0;i<=n;i++)A.push(mk(i));P=A[0];B=[];Wl=[];conf=[];t=0;R=R0;cx=rnd(M*.37,M*.63);cy=rnd(M*.37,M*.63);
  const f=(M/2400)**2;
  trees=Array.from({length:Math.round(70*f)},()=>({x:rnd(60,M-60),y:rnd(60,M-60),r:rnd(26,44)}));
  pk=Array.from({length:Math.round(90*f)},()=>({x:rnd(60,M-60),y:rnd(60,M-60),k:Math.random()<.7?'w':'h'}));
}
function demoStart(){world(11);foc=null}
function start(n){lastN=n;au();world(n);pend=false;['intro','menu','skins','end','set'].forEach(i=>show(i,0));$('hud').style.display='flex';$('gear').style.display='block';setS('play')}
function goMenu(){['intro','skins','end','set'].forEach(i=>show(i,0));show('menu',1);$('hud').style.display='none';$('gear').style.display='none';setS('menu');ui()}
function toMenu(){demoStart();goMenu()}
function openSet(){if(state==='play')setS('pause');show('set',1);const g=state==='pause';$('sres').style.display=g?'':'none';$('smenu').style.display=g?'':'none';$('sback').style.display=g?'none':''}
function closeSet(){show('set',0);if(state==='pause')setS('play')}
$('done').onclick=()=>{const n=$('nick0'),v=n.value.trim();if(!v){n.classList.remove('shake');void n.offsetWidth;n.classList.add('shake');n.focus();return}S.nick=v.slice(0,14);save();if(P)P.nm=S.nick;goMenu()};
$('nick0').onkeydown=e=>{if(e.key==='Enter')$('done').click()};
$('nickb').onclick=()=>{show('menu',0);show('intro',1);setS('intro')};
$('play').onclick=()=>start(S.bots);$('train').onclick=()=>start(5);
$('mset').onclick=openSet;$('gear').onclick=openSet;$('mfs').onclick=fs;
$('cBL').onclick=()=>{show('menu',0);show('skins',1);setS('skins')};$('skb').onclick=goMenu;
$('vb').onclick=()=>{S.mute=!S.mute;save();vi()};$('vm').oninput=e=>{S.vol=e.target.value/100;S.mute=false;vi()};$('vm').onchange=save;
$('sres').onclick=closeSet;$('sback').onclick=closeSet;$('smenu').onclick=()=>{show('set',0);toMenu()};
$('again').onclick=()=>start(lastN);$('m2').onclick=toMenu;
document.addEventListener('click',e=>{if(e.target.closest('button'))SFX.click()});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.type!=='range')return;keys[e.code]=true;
  if(e.code==='Escape'||e.code==='KeyP'){if(state==='play')openSet();else if($('set').style.display==='grid')closeSet()}
  if((e.code==='KeyE'||e.code==='Space')&&!e.repeat){pend=true;if(state==='play')e.preventDefault()}});
addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>{if(state==='play')openSet()});
C.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
C.addEventListener('mousedown',()=>{if(!touchOn())mouse.d=true});addEventListener('mouseup',()=>mouse.d=false);
C.addEventListener('contextmenu',e=>e.preventDefault());

/* touch sticks */
const J={l:{id:null,x:0,y:0,on:false},r:{id:null,x:0,y:0,on:false}};
function stick(el,o){const k=el.firstElementChild;
  const mv=e=>{if(e.pointerId!==o.id)return;const r=el.getBoundingClientRect();let dx=(e.clientX-r.left-r.width/2)/(r.width/2),dy=(e.clientY-r.top-r.height/2)/(r.height/2);const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}o.x=dx;o.y=dy;o.on=true;k.style.transform='translate('+dx*40+'px,'+dy*40+'px)'};
  const up=e=>{if(e.pointerId!==o.id)return;o.id=null;o.x=o.y=0;o.on=false;k.style.transform=''};
  el.addEventListener('pointerdown',e=>{if(o.id!==null)return;o.id=e.pointerId;el.setPointerCapture(e.pointerId);mv(e)});
  el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}
stick($('jl'),J.l);stick($('jr'),J.r);$('bb').addEventListener('pointerdown',()=>{pend=true});

/* gameplay */
function shoot(a,ang,dmg){B.push({x:a.x+Math.cos(ang)*26,y:a.y+Math.sin(ang)*26,vx:Math.cos(ang)*900,vy:Math.sin(ang)*900,l:.9,o:a,d:dmg});
  if(DEMO())return;if(a===P)SFX.shoot(1);else{const d=Math.hypot(a.x-P.x,a.y-P.y);if(d<700)SFX.shoot(.6*(1-d/700))}}
function build(a){
  if(a.wood<10)return;
  const px=a.x+Math.cos(a.a)*70,py=a.y+Math.sin(a.a)*70,v=Math.abs(Math.cos(a.a))>Math.abs(Math.sin(a.a));
  const w=v?16:90,h=v?90:16;a.wood-=10;Wl.push({x:px-w/2,y:py-h/2,w,h,hp:150});if(a===P&&!DEMO())SFX.build();
}
function move(a,vx,vy,dt){
  a.x=Math.min(M-20,Math.max(20,a.x+vx*dt));a.y=Math.min(M-20,Math.max(20,a.y+vy*dt));
  for(const w of Wl){
    const qx=Math.max(w.x,Math.min(a.x,w.x+w.w)),qy=Math.max(w.y,Math.min(a.y,w.y+w.h));
    let dx=a.x-qx,dy=a.y-qy,d=Math.hypot(dx,dy);
    if(d<18){if(d===0){dy=-1;d=1}a.x+=dx/d*(18-d);a.y+=dy/d*(18-d)}
  }
}
function ai(a,dt){
  let tg=null,bd=1e9;
  for(const o of A)if(o!==a&&o.hp>0){const d=Math.hypot(o.x-a.x,o.y-a.y);if(d<bd){bd=d;tg=o}}
  let mx=0,my=0;const dc=Math.hypot(cx-a.x,cy-a.y);
  if(tg&&bd<500)a.a=Math.atan2(tg.y-a.y,tg.x-a.x);
  if(dc>R-150){const q=Math.atan2(cy-a.y,cx-a.x);mx=Math.cos(q);my=Math.sin(q);if(!(tg&&bd<500))a.a=q}
  else if(tg&&bd<500){const q=a.a;if(bd>260){mx=Math.cos(q);my=Math.sin(q)}else{mx=-Math.sin(q)*a.sd;my=Math.cos(q)*a.sd}if(Math.random()<dt*.5)a.sd*=-1}
  else{a.tt-=dt;
    if(a.tt<=0||Math.hypot(a.tx-a.x,a.ty-a.y)<30){const p=pk[Math.floor(Math.random()*pk.length)];if(p&&Math.random()<.6){a.tx=p.x;a.ty=p.y}else{a.tx=cx+rnd(-R*.6,R*.6);a.ty=cy+rnd(-R*.6,R*.6)}a.tt=rnd(3,7)}
    const q=Math.atan2(a.ty-a.y,a.tx-a.x);mx=Math.cos(q);my=Math.sin(q);a.a=q}
  move(a,mx*165,my*165,dt);
  if(tg&&bd<500&&a.cd<=0){shoot(a,a.a+rnd(-.13,.13),10);a.cd=.55}
  a.bc-=dt;if(tg&&bd<350&&a.hp<60&&a.bc<=0&&a.wood>=10){build(a);a.bc=4}
}
function update(dt){
  const demo=DEMO();t+=dt;R=Math.max(40,R0-t*SP);
  if(demo){if(!foc||foc.hp<=0)foc=A.find(a=>a.hp>0)||A[0];camx+=(foc.x-W/2-camx)*Math.min(1,dt*3);camy+=(foc.y-H/2-camy)*Math.min(1,dt*3)}
  else{
    camx=P.x-W/2;camy=P.y-H/2;let vx,vy,fire=false;
    if(touchOn()){vx=J.l.x;vy=J.l.y;if(J.r.on&&Math.hypot(J.r.x,J.r.y)>.2){P.a=Math.atan2(J.r.y,J.r.x);fire=true}}
    else{vx=(keys.KeyD?1:0)-(keys.KeyA?1:0);vy=(keys.KeyS?1:0)-(keys.KeyW?1:0);P.a=Math.atan2(mouse.y+camy-P.y,mouse.x+camx-P.x);fire=mouse.d}
    const l=Math.max(1,Math.hypot(vx,vy));move(P,vx/l*220,vy/l*220,dt);
    if(fire&&P.cd<=0){shoot(P,P.a,14);P.cd=.25}
    if(pend)build(P);pend=false;
  }
  for(const a of A){a.cd-=dt;if(a.hp>0&&(a!==P||demo))ai(a,dt)}
  for(const b of B){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;
    for(const w of Wl)if(b.x>w.x&&b.x<w.x+w.w&&b.y>w.y&&b.y<w.y+w.h){w.hp-=b.d;b.l=0;break}
    if(b.l>0)for(const a of A)if(a!==b.o&&a.hp>0&&Math.hypot(a.x-b.x,a.y-b.y)<20){a.hp-=b.d;b.l=0;if(!demo&&(a===P||b.o===P))SFX.hit(1);break}
  }
  B=B.filter(b=>b.l>0);Wl=Wl.filter(w=>w.hp>0);
  const dmg=4+t/20;
  for(const a of A){
    if(a.hp<=0)continue;
    if(Math.hypot(a.x-cx,a.y-cy)>R)a.hp-=dmg*dt;
    for(let i=pk.length-1;i>=0;i--){const p=pk[i];if(Math.abs(a.x-p.x)<30&&Math.abs(a.y-p.y)<30&&Math.hypot(a.x-p.x,a.y-p.y)<28){
      if(p.k==='w'){a.wood=Math.min(200,a.wood+10);pk.splice(i,1);if(a===P&&!demo)SFX.pick()}else if(a.hp<100){a.hp=Math.min(100,a.hp+25);pk.splice(i,1);if(a===P&&!demo)SFX.pick()}}}
  }
  A=A.filter(a=>a.hp>0||a===P);
  const alive=A.filter(a=>a.hp>0).length;
  if(demo){if(alive<=1||t>85)demoStart();return}
  $('al').textContent=T('alive')+': '+alive;$('hp').style.width=Math.max(0,P.hp)+'%';$('wd').textContent=T('wood')+': '+Math.floor(P.wood);
  $('st').textContent=Math.hypot(P.x-cx,P.y-cy)>R?T('storm'):'';
  if(P.hp<=0)end(false);else if(alive===1)end(true);
}
function end(win){
  $('hud').style.display='none';$('gear').style.display='none';B=[];
  if(win){setS('win');winT=0;SFX.win();const cl=['#ff4fa3','#39e0ee','#ffd23f','#4be37a','#9d6bff'];
    for(let i=0;i<(S.gfx?180:70);i++)conf.push({x:rnd(0,W),y:rnd(-H,0),vx:rnd(-40,40),vy:rnd(120,320),c:cl[i%5],r:rnd(3,7),ph:rnd(0,6)})}
  else{SFX.lose();endUI(false)}
}
function endUI(win){setS('over');$('pop').textContent=T(win?'win':'lose');$('etx').textContent=(S.nick?S.nick+': ':'')+(win?T('winT'):T('loseT')(Math.floor(t)));
  const p=$('pop');p.style.animation='none';void p.offsetWidth;p.style.animation='';show('end',1)}

function draw(){
  X.setTransform(Q,0,0,Q,0,0);
  X.fillStyle='#3b6e47';X.fillRect(0,0,W,H);
  if(!P)return;
  const z=state==='win'?1+Math.min(winT,1.2)*.35:1;
  if(state==='win'){camx=P.x-W/2;camy=P.y-H/2}
  const vx=camx+W/2,vy=camy+H/2,vis=(x,y,m)=>Math.abs(x-vx)<W/2/z+m&&Math.abs(y-vy)<H/2/z+m;
  X.save();X.translate(W/2,H/2);X.scale(z,z);X.translate(-W/2,-H/2);X.translate(-camx,-camy);
  if(S.gfx>0){X.strokeStyle='rgba(255,255,255,.07)';X.lineWidth=1;X.beginPath();
    const x0=Math.max(0,Math.floor((vx-W/2/z)/100)*100),x1=Math.min(M,vx+W/2/z+100),y0=Math.max(0,Math.floor((vy-H/2/z)/100)*100),y1=Math.min(M,vy+H/2/z+100);
    for(let i=x0;i<=x1;i+=100){X.moveTo(i,y0);X.lineTo(i,y1)}for(let i=y0;i<=y1;i+=100){X.moveTo(x0,i);X.lineTo(x1,i)}X.stroke()}
  for(const p of pk){if(!vis(p.x,p.y,30))continue;
    if(p.k==='w'){X.fillStyle='#9a6b3a';X.fillRect(p.x-11,p.y-11,22,22);X.strokeStyle='#5c3b18';X.lineWidth=2;X.strokeRect(p.x-11,p.y-11,22,22)}
    else{X.fillStyle='#4be37a';X.fillRect(p.x-4,p.y-12,8,24);X.fillRect(p.x-12,p.y-4,24,8)}}
  for(const w of Wl){X.fillStyle='rgba(176,124,66,'+(.4+w.hp/250)+')';X.fillRect(w.x,w.y,w.w,w.h);X.strokeStyle='#5c3b18';X.lineWidth=2;X.strokeRect(w.x,w.y,w.w,w.h)}
  if(state==='win'){for(let i=0;i<3;i++){const r=(winT*140+i*70)%210;X.strokeStyle='rgba(255,230,107,'+(1-r/210)+')';X.lineWidth=5;X.beginPath();X.arc(P.x,P.y,20+r,0,7);X.stroke()}}
  X.font='bold 13px Segoe UI,Arial,sans-serif';X.textAlign='center';
  for(const a of A){
    if(a.hp<=0||!vis(a.x,a.y,60))continue;
    if(S.gfx>1){X.fillStyle='rgba(0,0,0,.25)';X.beginPath();X.ellipse(a.x+4,a.y+9,17,10,0,0,7);X.fill()}
    drawTank(X,a.x,a.y,a===P&&state==='win'?winT*7:a.a,a.sk,a===P&&!DEMO()?'#111':'#e8475f');
    X.lineWidth=3;X.strokeStyle='rgba(0,0,0,.7)';X.strokeText(a.nm,a.x,a.y-38);X.fillStyle=a===P&&!DEMO()?'#ffe66b':'#fff';X.fillText(a.nm,a.x,a.y-38);
    if(a!==P||DEMO()){X.fillStyle='rgba(0,0,0,.5)';X.fillRect(a.x-16,a.y-32,32,4);X.fillStyle='#4be37a';X.fillRect(a.x-16,a.y-32,32*a.hp/100,4)}
  }
  X.fillStyle='#ffe66b';if(S.gfx>1){X.shadowColor='#ffe66b';X.shadowBlur=10}
  for(const b of B){X.beginPath();X.arc(b.x,b.y,3,0,7);X.fill()}X.shadowBlur=0;
  if(S.gfx>0){X.fillStyle='rgba(30,90,45,.88)';for(const r of trees){if(!vis(r.x,r.y,50))continue;X.beginPath();X.arc(r.x,r.y,r.r,0,7);X.fill()}}
  X.fillStyle='rgba(120,40,200,.4)';X.beginPath();X.rect(-2000,-2000,M+4000,M+4000);X.arc(cx,cy,R,0,7,true);X.fill('evenodd');
  X.strokeStyle='#c89bff';X.lineWidth=4;X.beginPath();X.arc(cx,cy,R,0,7);X.stroke();
  X.restore();
  for(const c of conf){X.fillStyle=c.c;X.save();X.translate(c.x,c.y);X.rotate(c.ph);X.fillRect(-c.r,-c.r/2,c.r*2,c.r);X.restore()}
  if(DEMO())return;
  const s=120/M,tc=touchOn(),mx=W-134,my=tc?70:H-134;
  X.fillStyle='rgba(0,0,0,.5)';X.fillRect(mx,my,120,120);
  X.save();X.beginPath();X.rect(mx,my,120,120);X.clip();X.strokeStyle='#c89bff';X.lineWidth=2;X.beginPath();X.arc(mx+cx*s,my+cy*s,R*s,0,7);X.stroke();
  for(const a of A){if(a.hp<=0)continue;X.fillStyle=a===P?'#39a0ee':'#e8475f';X.fillRect(mx+a.x*s-2,my+a.y*s-2,4,4)}X.restore();
}
function loop(n){
  const dt=Math.min(.05,(n-last)/1000);last=n;
  if(state==='play'||DEMO())update(dt);
  if(state==='win'){winT+=dt;if(winT>2.4)endUI(true)}
  for(const c of conf){c.x+=c.vx*dt+Math.sin(c.ph+=dt*4)*20*dt;c.y+=c.vy*dt;if(c.y>H+10&&(state==='win'||state==='over'))c.y=-10}
  draw();requestAnimationFrame(loop);
}
rs();demoStart();ui();requestAnimationFrame(loop);
</script>
