<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>tank.io</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
:root{--ov:rgba(8,16,30,.5);--ink:#f1f6ff;--hot:#ff4fa3;--zap:#39e0ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--ov:rgba(8,16,30,.55)}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#12202e;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
canvas#c{display:block;width:100%;height:100%;cursor:crosshair}
button,select,input{font-family:inherit}
button{cursor:pointer;color:#fff;border:0}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--zap);outline-offset:3px}
.ov{position:fixed;inset:0;display:none;place-items:center;background:var(--ov);text-align:center;padding:16px;overflow:auto}
.card{background:rgba(14,26,44,.88);border:2px solid rgba(57,224,238,.4);border-radius:22px;padding:24px;width:min(460px,100%);box-shadow:0 0 50px rgba(57,224,238,.2);display:grid;gap:14px}
h1,h2,h3,p{margin:0}
.logo{font:900 clamp(3.4rem,13vw,6.5rem)/1 'Arial Black',Impact,sans-serif;letter-spacing:-.02em;background:linear-gradient(90deg,#5dff7a,#39e0ee,#ff4fa3,#ffd23f,#5dff7a);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.45));animation:hue 6s linear infinite,wob 2.6s ease-in-out infinite}
@keyframes hue{to{background-position:300% 0}}
@keyframes wob{50%{transform:rotate(-2deg) scale(1.04)}}
.inp{width:100%;background:rgba(40,160,150,.55);color:#fff;border:2px solid rgba(255,255,255,.35);border-radius:14px;padding:13px 16px;font:700 1.1rem 'Segoe UI',sans-serif;text-align:center}
.inp::placeholder{color:rgba(255,255,255,.65)}
.shake{animation:shk .4s;border-color:var(--hot)!important}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pill{display:flex;align-items:center;justify-content:space-between;gap:10px;width:min(340px,90vw);margin:0 auto;border-radius:44px;padding:8px 24px;font:900 1.6rem 'Arial Black',Impact,sans-serif;background:linear-gradient(#35d4ff,#1e8bd8);border:3px solid #0c4f8a;text-shadow:0 2px 0 rgba(0,0,0,.4);box-shadow:0 5px 0 #0a3a66;transition:transform .15s}
.pill.p2{background:linear-gradient(#b27cff,#6a3fd1);border-color:#3b2380;box-shadow:0 5px 0 #2a1860;font-size:1.2rem}
.pill.p3{background:linear-gradient(#ffb347,#e8761f);border-color:#8a4310;box-shadow:0 5px 0 #6a320c;justify-content:center}
.pill:hover{transform:scale(1.05)}.pill:active{transform:translateY(4px)}
.pill canvas{width:56px;height:56px}
.btn{background:var(--hot);border-radius:12px;padding:12px 24px;font:800 1.05rem 'Segoe UI',sans-serif;margin:0 auto}
.btn.g{background:rgba(255,255,255,.16)}.btn.s{padding:8px 14px;font-size:.9rem}
.cb{display:grid;justify-items:center;gap:4px;background:none;font-weight:800;font-size:.85rem;text-shadow:0 1px 3px #000}
.ic{width:58px;height:58px;display:grid;place-items:center;border-radius:50%;background:rgba(120,70,220,.85);border:3px solid rgba(255,255,255,.5);font-size:1.9rem;line-height:1}
#cTR{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;display:flex;gap:14px}
#cBL{position:absolute;left:14px;bottom:14px}
#cBR{position:absolute;right:14px;bottom:14px;display:grid;justify-items:center;gap:6px;font-weight:800;font-size:.85rem;text-shadow:0 1px 3px #000}
#cBR input{width:90px}
#cBL canvas{width:72px;height:72px}
#hint{position:absolute;bottom:14px;left:0;right:0;font-size:.8rem;opacity:.8;padding:0 130px;text-shadow:0 1px 3px #000}
#stat{font-weight:700;color:#bfe9ff;text-shadow:0 1px 3px #000}
#sk{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-height:54vh;overflow-y:auto;padding:6px;border-radius:12px;background:rgba(0,0,0,.25)}
#sk button{background:rgba(255,255,255,.08);border:2px solid transparent;border-radius:10px;padding:2px;transition:transform .15s}
#sk button:hover{transform:scale(1.15) rotate(-4deg)}
#sk button.sel{border-color:var(--zap);background:rgba(57,224,238,.2)}
#sk canvas{width:100%;height:auto;display:block}
#skn{font-weight:800;color:var(--zap)}
#setb{display:grid;gap:12px;text-align:left}
#setb label{display:grid;gap:5px;font-weight:700}
select{background:#16324f;color:var(--ink);border:1px solid #3a6c9a;border-radius:8px;padding:10px 12px;font:inherit}
input[type=range]{width:100%;accent-color:#39e0ee}
#hud{position:fixed;left:14px;top:calc(14px + env(safe-area-inset-top,0px));display:none;pointer-events:none;font-weight:700;text-shadow:0 1px 3px #000;gap:6px}
#hud>div{display:grid;gap:6px}
#st{font-size:1.1rem}
.bar{width:220px;height:16px;border-radius:8px;background:rgba(0,0,0,.45);overflow:hidden}
#hp{height:100%;width:100%;background:#4be37a;transition:width .1s}
#gear{position:fixed;right:14px;top:calc(14px + env(safe-area-inset-top,0px));width:48px;height:48px;border-radius:50%;background:rgba(120,70,220,.85);border:3px solid rgba(255,255,255,.5);font-size:1.5rem;display:none;z-index:3}
#touch{display:none}
.js{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom,0px));width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);touch-action:none;z-index:2}
.js i{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:rgba(255,255,255,.45)}
#jl{left:26px}#jr{right:26px}
#bb{position:fixed;right:40px;bottom:calc(190px + env(safe-area-inset-bottom,0px));width:68px;height:68px;border-radius:50%;background:rgba(176,124,66,.9);border:3px solid #fff;font:800 .8rem 'Segoe UI',sans-serif;z-index:2}
#pop{animation:pop 1s cubic-bezier(.2,1.6,.4,1) both;font:900 clamp(2.4rem,9vw,4rem) 'Arial Black',sans-serif}
@keyframes pop{from{transform:scale(.2) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
/* lobby */
.lw{width:min(920px,100%);display:grid;gap:12px;text-align:left}
.lg{display:grid;grid-template-columns:1fr 2fr;gap:12px}
.pn{background:rgba(14,26,44,.92);border:2px solid rgba(57,224,238,.3);border-radius:16px;padding:12px;max-height:40vh;overflow:auto;display:grid;gap:8px;align-content:start}
.pn h3{color:var(--zap);font-size:.95rem;text-transform:uppercase;letter-spacing:.08em}
.row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:10px;padding:5px 10px}
.row canvas{width:34px;height:34px}.row span{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small{opacity:.75}
.ctl{display:flex;gap:8px;flex-wrap:wrap}.ctl .inp{width:110px;padding:8px;font-size:.95rem}
#lc{height:90px;overflow-y:auto;font-size:.9rem;text-align:left;display:grid;align-content:start;gap:2px}
.cr{display:flex;gap:8px}.cr .inp{text-align:left;padding:9px 12px;font-size:.95rem}
@media (max-width:700px){.lg{grid-template-columns:1fr}#sk{grid-template-columns:repeat(5,1fr)}#hint{display:none}}
@media (prefers-reduced-motion:reduce){.logo,#pop,.shake{animation:none}}
#fps{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font:700 .8rem monospace;color:#9cf;text-shadow:0 1px 2px #000;z-index:9;pointer-events:none}
.pc{display:grid;justify-items:center;gap:6px;background:rgba(255,255,255,.07);border-radius:14px;padding:10px}.pc canvas{width:96px;height:96px}
#sg2{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-height:52vh;overflow-y:auto}
.bal{display:flex;align-items:center;justify-content:center;gap:6px;font-size:1.2rem;font-weight:800}
#rcfg label{display:grid;gap:4px;font-weight:700;font-size:.9rem}
@property --an{syntax:'<angle>';initial-value:0deg;inherits:false}
.adm{position:relative;width:min(660px,100%);padding:26px;border-radius:26px;background:linear-gradient(160deg,rgba(26,14,64,.97),rgba(8,26,56,.97));text-align:left;display:grid;gap:18px;overflow:hidden;animation:admIn .75s cubic-bezier(.2,1.3,.3,1) both;box-shadow:0 0 90px rgba(130,80,255,.5)}
.adm::before{content:"";position:absolute;inset:0;border-radius:26px;padding:2px;background:conic-gradient(from var(--an),#ff4fa3,#39e0ee,#ffd23f,#9d6bff,#ff4fa3);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:admSpin 6s linear infinite;pointer-events:none}
.adm>*{position:relative}
.adm-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 0%,rgba(255,79,163,.28),transparent 45%),radial-gradient(circle at 95% 100%,rgba(57,224,238,.25),transparent 50%);animation:admPulse 5s ease-in-out infinite}
.adm-h{display:flex;gap:14px;align-items:center}
.adm-badge{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font:900 1.9rem 'Arial Black',sans-serif;background:linear-gradient(135deg,#ff4fa3,#9d6bff);box-shadow:0 0 26px rgba(255,79,163,.65);animation:badge 3.2s ease-in-out infinite}
.adm-h h2{font:900 1.7rem 'Arial Black',sans-serif;letter-spacing:.03em;background:linear-gradient(90deg,#fff,#9fe9ff,#ffb3e6,#fff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 5s linear infinite}
.adm-sub{color:#aab6e0;font-size:.9rem;margin-top:2px}
.adm-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ac{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px;display:grid;gap:10px;animation:acIn .55s both;animation-delay:calc(var(--i)*80ms + 250ms);transition:transform .2s,box-shadow .2s,border-color .2s}
.ac:hover{transform:translateY(-3px);border-color:var(--c1);box-shadow:0 8px 26px rgba(0,0,0,.35)}
.ac.wide{grid-column:1/-1}
.ac-h{display:flex;align-items:center;gap:10px}
.ac-i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--c1);background:rgba(255,255,255,.08)}
.ac-t{flex:1;font-weight:800;font-size:.92rem}
.ac-v{min-width:52px;text-align:center;padding:3px 10px;border-radius:20px;background:var(--c1);color:#0b1226;font-weight:900;font-size:.85rem}
input.fx{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:6px;background:linear-gradient(90deg,var(--c1) var(--p,50%),rgba(255,255,255,.16) var(--p,50%));outline:none}
input.fx::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--c1);box-shadow:0 0 12px var(--c1);cursor:pointer;transition:transform .15s}
input.fx::-webkit-slider-thumb:hover{transform:scale(1.25)}
input.fx::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--c1);cursor:pointer}
.sw{position:relative;width:54px;height:30px;display:inline-block}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;border-radius:30px;background:rgba(255,255,255,.2);transition:.3s;cursor:pointer}
.sw span::before{content:"";position:absolute;left:4px;top:4px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.3s}
.sw input:checked+span{background:linear-gradient(90deg,#9d6bff,#ff4fa3);box-shadow:0 0 18px rgba(157,107,255,.7)}
.sw input:checked+span::before{transform:translateX(24px)}
.adm-foot{display:flex;align-items:center;justify-content:space-between;gap:12px}
.adm-st{font-weight:800;font-size:.85rem;color:#ffb38a;display:flex;align-items:center;gap:8px}
.adm-st::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.adm-st.ok{color:#5dff9a}.adm-st.pop{animation:stPop .6s}
.adm-p{position:absolute;bottom:-14px;border-radius:50%;background:rgba(255,255,255,.5);pointer-events:none;animation:flt linear infinite}
@keyframes admIn{from{opacity:0;transform:translateY(40px) scale(.9) rotateX(18deg)}}
@keyframes admSpin{to{--an:360deg}}
@keyframes admPulse{50%{opacity:.55}}
@keyframes badge{50%{transform:rotate(-6deg) scale(1.08)}}
@keyframes acIn{from{opacity:0;transform:translateY(22px) scale(.92)}}
@keyframes stPop{30%{transform:scale(1.18)}}
@keyframes flt{from{transform:translateY(0);opacity:0}15%{opacity:.8}to{transform:translateY(-560px);opacity:0}}
:root{--c1:#39e0ee}
.card{position:relative;overflow:hidden;background:linear-gradient(160deg,rgba(26,14,64,.97),rgba(8,26,56,.97));border:0;border-radius:26px;animation:admIn .75s cubic-bezier(.2,1.3,.3,1) both;box-shadow:0 0 90px rgba(130,80,255,.5)}
.card::before{content:"";position:absolute;inset:0;border-radius:26px;padding:2px;background:conic-gradient(from var(--an),#ff4fa3,#39e0ee,#ffd23f,#9d6bff,#ff4fa3);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:admSpin 6s linear infinite;pointer-events:none}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 0%,rgba(255,79,163,.25),transparent 45%),radial-gradient(circle at 95% 100%,rgba(57,224,238,.22),transparent 50%);animation:admPulse 5s ease-in-out infinite}
.card>*{position:relative;z-index:1}
.card>.adm-p{position:absolute;z-index:0}
.card h2{font:900 1.5rem 'Arial Black',sans-serif;letter-spacing:.03em;background:linear-gradient(90deg,#fff,#9fe9ff,#ffb3e6,#fff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 5s linear infinite}
#setb label,#rcfg label{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px;gap:10px;animation:acIn .5s both;transition:transform .2s,border-color .2s}
#setb label:hover,#rcfg label:hover{transform:translateY(-2px);border-color:var(--c1)}
#setb label:nth-child(1){--c1:#39e0ee;animation-delay:.25s}#setb label:nth-child(2){--c1:#ffd23f;animation-delay:.32s}#setb label:nth-child(3){--c1:#ff4fa3;animation-delay:.39s}#setb label:nth-child(4){--c1:#9d6bff;animation-delay:.46s}
.pn{border:2px solid transparent;border-radius:18px;background:linear-gradient(160deg,#1a0e40,#081a38) padding-box,conic-gradient(from var(--an),#ff4fa3,#39e0ee,#ffd23f,#9d6bff,#ff4fa3) border-box;animation:admSpin 8s linear infinite,acIn .55s both}
.row{transition:transform .2s,background .2s}.row:hover{transform:translateX(4px);background:rgba(255,255,255,.14)}
.btn{background:linear-gradient(90deg,#ff4fa3,#ff8a3d);box-shadow:0 4px 18px rgba(255,79,163,.4);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 8px 26px rgba(255,79,163,.55)}
.btn.g{background:rgba(255,255,255,.14);box-shadow:none}
.pc{border:1px solid rgba(255,255,255,.1);border-radius:16px;animation:acIn .5s both;transition:transform .2s,box-shadow .2s,border-color .2s}
.pc:hover{transform:translateY(-4px);border-color:#ffd23f;box-shadow:0 10px 28px rgba(0,0,0,.4)}
.bal{background:rgba(255,200,58,.12);border:1px solid rgba(255,200,58,.4);border-radius:30px;padding:6px 16px;justify-self:center}
.cb .ic{transition:transform .2s,box-shadow .2s}.cb:hover .ic{transform:scale(1.12) rotate(-6deg);box-shadow:0 0 22px rgba(157,107,255,.85)}
#hud>div{background:rgba(14,10,40,.55);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:10px 14px;backdrop-filter:blur(4px)}
#hp{background:linear-gradient(90deg,#4be37a,#b6ff6b);box-shadow:0 0 12px rgba(75,227,122,.6)}
#fps{background:rgba(14,10,40,.6);border-radius:10px;padding:2px 8px}
#sk{border:1px solid rgba(255,255,255,.1)}
#sk button.sel{box-shadow:0 0 16px var(--zap)}
@media (prefers-reduced-motion:reduce){.card,.card::before,.card::after,.pn,.pc,#setb label,#rcfg label{animation:none}}
.amsg{color:#ffb3a8;font-weight:700;min-height:1.2em}
#cLV{position:absolute;top:calc(112px + env(safe-area-inset-top,0px));left:14px}
#lvI{font:900 1.3rem 'Arial Black',sans-serif}
.lv-top{display:flex;gap:16px;align-items:center;text-align:left}
.lv-hex{width:92px;height:104px;flex:none;display:grid;place-items:center;font:900 2.2rem 'Arial Black',sans-serif;background:linear-gradient(135deg,#ff4fa3,#9d6bff,#39e0ee);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);animation:badge 3.2s ease-in-out infinite}
.lv-rank{font:900 1.5rem 'Arial Black',sans-serif;background:linear-gradient(90deg,#ffd23f,#ff4fa3);-webkit-background-clip:text;background-clip:text;color:transparent}
.lv-xp{color:#aab6e0;font-weight:700;margin-top:4px}
.lv-bar{position:relative;height:28px;border-radius:14px;background:rgba(255,255,255,.12);overflow:hidden}
.lv-bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:14px;overflow:hidden;background:linear-gradient(90deg,#39e0ee,#9d6bff,#ff4fa3);transition:width 1.2s cubic-bezier(.2,.9,.3,1)}
.lv-bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);animation:shine 2s linear infinite}
.lv-bar span{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:.85rem;text-shadow:0 1px 3px #000}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.lv-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lv-stats div{background:rgba(255,255,255,.07);border-radius:12px;padding:10px 4px;font-size:.78rem;color:#aab6e0}.lv-stats b{display:block;font-size:1.2rem;color:#fff}
.lv-ms{display:grid;gap:6px;max-height:24vh;overflow-y:auto;text-align:left}
.lv-ms div{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.06);font-weight:700}
.lv-ms div.on{background:rgba(93,255,154,.14);color:#aaffc8}
.lv-ms em{font-style:normal;margin-left:auto;opacity:.8;font-size:.85rem}
@media (max-width:600px){.adm-grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.adm,.adm::before,.adm-glow,.adm-badge,.ac,.adm-p,.adm-h h2{animation:none}}
#cTL{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:14px}
@media (max-width:700px){#sg2{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fps">FPS</div>
<div id="hud"><div><div id="al"></div><div class="bar"><div id="hp"></div></div><div id="wd"></div><div id="st"></div></div></div>
<button id="gear" aria-label="Settings">&#9881;</button>
<div id="touch"><div class="js" id="jl"><i></i></div><div class="js" id="jr"><i></i></div><button id="bb" data-i="wall"></button></div>

<div class="ov" id="intro" style="display:grid"><div class="card">
<h1 class="logo">tank.io</h1>
<input class="inp" id="nick0" maxlength="14" autocomplete="off" spellcheck="false">
<input class="inp" id="pass0" type="password" maxlength="64" autocomplete="current-password" data-ph="passPh"><p id="amsg" class="amsg"></p>
<button class="btn" id="login" data-i="login"></button><button class="btn g" id="reg" data-i="reg"></button><button class="btn g" id="guest" data-i="guest"></button>
<button class="btn" id="cont" data-i="cont"></button><button class="btn g" id="out" data-i="out"></button>
<button class="btn" id="done" data-i="done"></button>
</div>
<button class="cb" id="ifs" style="position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px"><span class="ic"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke="#fff" stroke-width="2.5" fill="none"/></svg></span><span data-i="fsb"></span></button></div>

<div class="ov" id="menu"><div style="display:grid;gap:14px;justify-items:center;width:100%">
<h1 class="logo">tank.io</h1>
<button class="inp" id="nickb" style="max-width:340px"></button>
<p id="stat"></p>
<button class="pill" id="play"><canvas class="pv" width="72" height="72"></canvas><span data-i="play"></span><canvas class="pv" width="72" height="72"></canvas></button>
<button class="pill p3" id="onl"><span data-i="onl"></span></button>

  if(online){for(const a of RA.concat(BA)){if(a.hp>0&&vis(a.x,a.y,60))drawActor(a,false)}for(const r of RA)if(r.dn&&!r.al&&vis(r.x,r.y,60))drawPod(r.x,r.y,rv.r===r?rv.t/3:0);if(P.hp<=0)drawPod(P.x,P.y,0)}
  if(!dm&&R<1e8&&state==='play'&&P.hp>0&&Math.hypot(P.x-cx,P.y-cy)>R){const an=Math.atan2(cy-P.y,cx-P.x);X.save();X.translate(P.x+Math.cos(an)*70,P.y+Math.sin(an)*70);X.rotate(an);X.fillStyle='rgba(255,255,255,.85)';X.beginPath();X.moveTo(14,0);X.lineTo(-8,-10);X.lineTo(-8,10);X.closePath();X.fill();X.restore()}
  X.fillStyle='#ffe66b';if(S.gfx>1){X.shadowColor='#ffe66b';X.shadowBlur=10}
  for(const b of B){X.beginPath();X.arc(b.x,b.y,3,0,7);X.fill()}X.shadowBlur=0;
  if(S.gfx>0)for(const r of trees){if(!vis(r.x,r.y,60))continue;X.globalAlpha=.62;X.fillStyle='#1f5d2e';X.beginPath();for(let i=0;i<8;i++){const a2=i*.7854+r.r,q=r.r*(i%2?.8:1.1);X.lineTo(r.x+Math.cos(a2)*q,r.y+Math.sin(a2)*q)}X.closePath();X.fill();X.fillStyle='#2f8a43';X.beginPath();for(let i=0;i<8;i++){const a2=i*.7854+.39+r.r,q=r.r*(i%2?.5:.75);X.lineTo(r.x+Math.cos(a2)*q,r.y+Math.sin(a2)*q)}X.closePath();X.fill();X.fillStyle='#5a3a1a';X.fillRect(r.x-3,r.y-3,6,6);X.globalAlpha=1}
  for(const h of HS){if(h.ra<.02||!vis(h.x+h.w/2,h.y+h.h/2,200))continue;const dy=-(1-h.ra)*16;X.globalAlpha=h.ra;X.fillStyle='#a8392e';X.fillRect(h.x-10,h.y-10+dy,h.w+20,h.h+20);X.fillStyle='#8c2d24';X.fillRect(h.x-10,h.y+h.h/2-8+dy,h.w+20,16);X.fillStyle='rgba(0,0,0,.2)';X.fillRect(h.x-10,h.y+h.h+4+dy,h.w+20,6);X.globalAlpha=1}
  if(R<1e8){X.fillStyle='rgba(120,40,200,.4)';X.beginPath();X.rect(-2000,-2000,M+4000,M+4000);X.moveTo(cx+R,cy);X.arc(cx,cy,R,0,Math.PI*2,true);X.fill('evenodd')}
  X.restore();
  for(const c of conf){X.fillStyle=c.c;X.save();X.translate(c.x,c.y);X.rotate(c.ph);X.fillRect(-c.r,-c.r/2,c.r*2,c.r);X.restore()}
  if(dm)return;
  const s=120/M,tc=touchOn(),mx=W-134,my=tc?70:H-134;
  X.save();X.beginPath();X.rect(mx,my,120,120);X.clip();X.fillStyle='rgba(30,40,60,.75)';X.fillRect(mx,my,120,120);
  X.fillStyle='rgba(75,160,90,.8)';X.beginPath();X.arc(mx+cx*s,my+cy*s,Math.min(R,M*3)*s,0,7);X.fill();
  const dots=online?A.concat(RA,BA):A;
  for(const a of dots){if(a.hp<=0)continue;X.fillStyle=a===P?'#39a0ee':'#e8475f';X.fillRect(mx+a.x*s-2,my+a.y*s-2,4,4)}X.restore();
}
function loop(n){
  const dt=Math.min(.05,(n-last)/1000);last=n;fc++;if(n-ft>=500){$('fps').textContent='FPS '+Math.round(fc*1000/(n-ft));fc=0;ft=n}
  gpTick();
  if(state==='play'||DEMO())update(dt);
  if(state==='shop')shopDraw();
  if(state==='win'){winT+=dt;if(winT>2.4)endUI(true,1)}
  for(const c of conf){c.x+=c.vx*dt+Math.sin(c.ph+=dt*4)*20*dt;c.y+=c.vy*dt;if(c.y>H+10&&(state==='win'||state==='over'))c.y=-10}
  draw();requestAnimationFrame(loop);
}
const RK=[[1,'Новачок','Rookie'],[5,'Розвідник','Scout'],[10,'Боєць','Fighter'],[20,'Ветеран','Veteran'],[30,'Снайпер','Sniper'],[40,'Командир','Commander'],[50,'Майстер','Master'],[65,'Легенда','Legend'],[80,'Титан','Titan'],[100,'Володар арени','Arena Lord']];
const xpFor=L=>60*(L-1)*(L-1),rankOf=L=>{let r=RK[0];for(const k of RK)if(L>=k[0])r=k;return r};
function lvUI(){
  const L=lvl(),li=S.lang==='uk'?1:2,a=xpFor(L),b=xpFor(L+1),xp=S.xp||0,pc=L>=100?100:Math.max(0,Math.min(100,(xp-a)/(b-a)*100));

  $('lvm').innerHTML=RK.map(k=>'<div class="'+(L>=k[0]?'on':'')+'"><span>'+(L>=k[0]?'●':'○')+'</span><span>'+k[li]+'</span><em>'+T('lvl')+' '+k[0]+'</em></div>').join('');
}
function gpTick(){
  const gs=navigator.getGamepads?navigator.getGamepads():[];let p=null;for(const g of gs)if(g&&g.connected){p=g;break}
  if(!p){GP=null;return}
  const dz=v=>Math.abs(v)<.2?0:v,b=i=>!!(p.buttons[i]&&p.buttons[i].pressed),
  d={lx:dz(p.axes[0]||0),ly:dz(p.axes[1]||0),rx:dz(p.axes[2]||0),ry:dz(p.axes[3]||0),fire:b(7)||b(5)||b(0),build:b(2)||b(1)||b(3),start:b(9),a:b(0)},pr=GPs.bp;
  d.act=!!(d.lx||d.ly||d.rx||d.ry||d.fire||d.build);if(d.act)GPs.act=Date.now();
  if(d.start&&!pr.start){if(state==='play')openSet();else if($('set').style.display==='grid')closeSet()}
  if(d.build&&!pr.build&&state==='play')pend=true;
  if(d.a&&!pr.a&&state==='menu')$('play').click();
  GPs.bp={start:d.start,build:d.build,a:d.a};GP=d;
}

async function doAuth(kind){
  const u=$('nick0').value.trim(),p=$('pass0').value,m=$('amsg');m.textContent='';
  if(!/^[A-Za-z0-9_]{3,14}$/.test(u)){m.textContent=T('accN');return}
  if(p.length<6){m.textContent=T('accP');return}
  m.textContent='…';
  try{const r=await api(kind,{u,p,d:{xp:S.xp,wins:S.wins,kills:S.kills,games:S.games,lang:S.lang,gfx:S.gfx,ctl:S.ctl,vol:S.vol,mute:S.mute}});
    if(!r||!r.ok){m.textContent=T('acc_'+(r&&r.e))||T('acc_x');return}
    S.tok=r.tok;applyProfile(r.p);$('pass0').value='';m.textContent='';goMenu()}catch(e){m.textContent=T('accE')}
}
